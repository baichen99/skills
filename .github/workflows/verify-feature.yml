name: Verify Feature package

on:
  push:
    paths:
      - 'skills/development/verify-feature/**'
      - '.github/workflows/verify-feature.yml'
  pull_request:
    paths:
      - 'skills/development/verify-feature/**'
      - '.github/workflows/verify-feature.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    defaults:
      run:
        working-directory: skills/development/verify-feature
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_package.py
